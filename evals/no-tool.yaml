  - { id: find-bug-inline, messages: [{ role: system, content: *system }, { role: user, content: "Find the bug in this snippet: `for i in 0..=v.len() { println!(\"{}\", v[i]); }`" }], checks: [{ no_tool_call: true }] }
  - { id: rename-inline, messages: [{ role: system, content: *system }, { role: user, content: "Rename these variables to be more descriptive: `let a = 5; let b = a * 2;`" }], checks: [{ no_tool_call: true }] }
  - { id: replace-template, messages: [{ role: system, content: *system }, { role: user, content: "Replace the placeholder in this template 'Hello {name}' with 'World' and show me the result." }], checks: [{ no_tool_call: true }] }
  - { id: harness-env-context, messages: [{ role: system, content: *system }, { role: user, content: "<environment_context><cwd>/repo</cwd></environment_context>\nHi! Who are you?" }], checks: [{ no_tool_call: true }] }
