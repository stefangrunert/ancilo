# Counter-check for the reliability pipeline (from the Codex counter-review):
# requests that must NOT trigger a tool call – although many contain action
# words, project vocabulary, harness text, markup or code. English and German.
# The same coding tool set as `tool-calling` is offered.
name: no-tool
tools: &tools
  - type: function
    function:
      name: read_file
      description: Read a text file.
      parameters: { type: object, properties: { path: { type: string } }, required: [path] }
  - type: function
    function:
      name: write_file
      description: Create or overwrite a file with the given content.
      parameters: { type: object, properties: { path: { type: string }, content: { type: string } }, required: [path, content] }
  - type: function
    function:
      name: edit_file
      description: Replace an exact snippet of text in a file.
      parameters: { type: object, properties: { path: { type: string }, old_text: { type: string }, new_text: { type: string } }, required: [path, old_text, new_text] }
  - type: function
    function:
      name: grep
      description: Search file contents with a regular expression.
      parameters: { type: object, properties: { pattern: { type: string } }, required: [pattern] }
  - type: function
    function:
      name: glob
      description: Find files by name pattern.
      parameters: { type: object, properties: { pattern: { type: string } }, required: [pattern] }
  - type: function
    function:
      name: bash
      description: Run a shell command in the project directory.
      parameters: { type: object, properties: { command: { type: string } }, required: [command] }

system: &system "You are a coding assistant working in a software project. Use the tools when an action on the project is needed; answer directly when it is not."

tasks:
  - { id: what-is-repo, messages: [{ role: system, content: *system }, { role: user, content: "What is a repository?" }], checks: [{ no_tool_call: true }] }
  - { id: how-run-tests, messages: [{ role: system, content: *system }, { role: user, content: "How do I run tests in a Rust project?" }], checks: [{ no_tool_call: true }] }
  - { id: write-explanation, messages: [{ role: system, content: *system }, { role: user, content: "Write an explanation of what a race condition is." }], checks: [{ no_tool_call: true }] }
  - { id: show-example, messages: [{ role: system, content: *system }, { role: user, content: "Show an example of a Python list comprehension." }], checks: [{ no_tool_call: true }] }
  - { id: explain-rebase, messages: [{ role: system, content: *system }, { role: user, content: "Can you explain what `git rebase` does?" }], checks: [{ no_tool_call: true }] }
  - { id: build-vs-run, messages: [{ role: system, content: *system }, { role: user, content: "What's the difference between `cargo build` and `cargo run`?" }], checks: [{ no_tool_call: true }] }
  - { id: regex-email, messages: [{ role: system, content: *system }, { role: user, content: "Give me a regex that matches an email address." }], checks: [{ no_tool_call: true }] }
  - { id: translate, messages: [{ role: system, content: *system }, { role: user, content: "Translate 'good morning' into German." }], checks: [{ no_tool_call: true }] }
  - { id: summarize-inline, messages: [{ role: system, content: *system }, { role: user, content: "Summarize in one sentence: The build failed because the linker could not find the OpenSSL library. After installing it, the build succeeded." }], checks: [{ no_tool_call: true }] }
  - { id: review-inline-code, messages: [{ role: system, content: *system }, { role: user, content: "Here is my code: ```fn main() { let x = 5; }``` Is there anything wrong with it?" }], checks: [{ no_tool_call: true }] }
  - { id: haiku, messages: [{ role: system, content: *system }, { role: user, content: "Write a haiku about compilers." }], checks: [{ no_tool_call: true }] }
  - { id: permissions-letters, messages: [{ role: system, content: *system }, { role: user, content: "In the output of ls -la I see drwxr-xr-x. What do the letters mean?" }], checks: [{ no_tool_call: true }] }
  - { id: branch-command, messages: [{ role: system, content: *system }, { role: user, content: "How would I create a new branch in git? Just tell me the command." }], checks: [{ no_tool_call: true }] }
  - { id: http-418, messages: [{ role: system, content: *system }, { role: user, content: "What does HTTP status 418 mean?" }], checks: [{ no_tool_call: true }] }
  - { id: rust-vs-python, messages: [{ role: system, content: *system }, { role: user, content: "Is Rust faster than Python in general?" }], checks: [{ no_tool_call: true }] }
  - { id: km-to-miles, messages: [{ role: system, content: *system }, { role: user, content: "Convert 3 kilometers to miles." }], checks: [{ no_tool_call: true }] }
  - { id: harness-reminder, messages: [{ role: system, content: *system }, { role: user, content: "<system-reminder>The current repository has uncommitted changes in src/main.rs.</system-reminder>\nWhat is the capital of France?" }], checks: [{ no_tool_call: true }] }
  - { id: fix-understanding, messages: [{ role: system, content: *system }, { role: user, content: "Please fix my understanding: is a mutex the same as a lock?" }], checks: [{ no_tool_call: true }] }
  - { id: motivational, messages: [{ role: system, content: *system }, { role: user, content: "Create a short motivational sentence for my team." }], checks: [{ no_tool_call: true }] }
  - { id: sql-query, messages: [{ role: system, content: *system }, { role: user, content: "Write a SQL query that selects all users older than 30." }], checks: [{ no_tool_call: true }] }
  - { id: dockerfile-example, messages: [{ role: system, content: *system }, { role: user, content: "Show an example of a Dockerfile for a Node app." }], checks: [{ no_tool_call: true }] }
  - { id: de-git-merge, messages: [{ role: system, content: *system }, { role: user, content: "Wie funktioniert ein Git-Merge?" }], checks: [{ no_tool_call: true }] }
  - { id: de-process-thread, messages: [{ role: system, content: *system }, { role: user, content: "Was ist der Unterschied zwischen einem Prozess und einem Thread?" }], checks: [{ no_tool_call: true }] }
  - { id: de-rest, messages: [{ role: system, content: *system }, { role: user, content: "Erkläre mir, was eine REST-API ist." }], checks: [{ no_tool_call: true }] }
  - { id: de-paragraph, messages: [{ role: system, content: *system }, { role: user, content: "Schreib mir einen kurzen Absatz über künstliche Intelligenz." }], checks: [{ no_tool_call: true }] }
