  - { id: de-merge-sentences, messages: [{ role: system, content: *system }, { role: user, content: "Füge diese beiden Sätze zu einem zusammen: 'Es regnet.' 'Ich bleibe drinnen.'" }], checks: [{ no_tool_call: true }] }
  - { id: de-check-math, messages: [{ role: system, content: *system }, { role: user, content: "Prüfe bitte diese Rechnung: 17 * 23 = 391?" }], checks: [{ no_tool_call: true }] }
  - { id: harness-command, messages: [{ role: system, content: *system }, { role: user, content: "<command-name>/help</command-name>\nWhat can you do?" }], checks: [{ no_tool_call: true }] }
  - { id: test-output-given, messages: [{ role: system, content: *system }, { role: user, content: "Here is the output of my tests:\n```\ntest parse ... FAILED: expected 3 got 4\n```\nWhat could be the reason?" }], checks: [{ no_tool_call: true }] }
