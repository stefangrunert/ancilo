[package]
name = "ancilo-app"
description = "Ancilo desktop app: menu bar, window, daemon start – the UI comes from the daemon"
version = "0.4.4"
edition = "2024"
license = "Apache-2.0"
publish = false

# Not part of the main workspace: building it needs the system WebView
# libraries, which headless CI machines do not have.
[workspace]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[features]
# "Ancilo Dev": a second app beside the release (packaging/app-local.sh dev).
dev = []

[dependencies]
tauri = { version = "2", features = ["tray-icon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
ancilo-core = { path = "../../crates/core" }
tauri-plugin-updater = "2"
tauri-plugin-notification = "2"

[dev-dependencies]
base64 = "0.23.1"
minisign = "0.10.0"
serde_json = "1"
tauri = { version = "2", features = ["test", "tray-icon"] }

[lints.rust]
unsafe_code = "forbid"
